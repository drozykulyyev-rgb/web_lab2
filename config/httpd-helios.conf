ServerRoot "/usr/local"
DefaultRuntimeDir "${LAB_ROOT}/run"
PidFile "${LAB_ROOT}/run/httpd.pid"
Mutex "default:${LAB_ROOT}/run"

Listen ${HTTP_PORT}
ServerName localhost:${HTTP_PORT}

<IfModule !mpm_prefork_module>
    <IfModule !mpm_worker_module>
        <IfModule !mpm_event_module>
            LoadModule mpm_prefork_module "${APACHE_MODULE_DIR}/mod_mpm_prefork.so"
        </IfModule>
    </IfModule>
</IfModule>

<IfModule !unixd_module>
    LoadModule unixd_module "${APACHE_MODULE_DIR}/mod_unixd.so"
</IfModule>
<IfModule !authz_core_module>
    LoadModule authz_core_module "${APACHE_MODULE_DIR}/mod_authz_core.so"
</IfModule>
<IfModule !dir_module>
    LoadModule dir_module "${APACHE_MODULE_DIR}/mod_dir.so"
</IfModule>
<IfModule !mime_module>
    LoadModule mime_module "${APACHE_MODULE_DIR}/mod_mime.so"
</IfModule>
<IfModule !log_config_module>
    LoadModule log_config_module "${APACHE_MODULE_DIR}/mod_log_config.so"
</IfModule>
<IfModule !proxy_module>
    LoadModule proxy_module "${APACHE_MODULE_DIR}/mod_proxy.so"
</IfModule>
<IfModule !proxy_fcgi_module>
    LoadModule proxy_fcgi_module "${APACHE_MODULE_DIR}/mod_proxy_fcgi.so"
</IfModule>

User "${LAB_USER}"
Group "${LAB_GROUP}"

<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 2
    MaxRequestWorkers 8
</IfModule>

DocumentRoot "${LAB_ROOT}/public"
DirectoryIndex index.html
TypesConfig "${APACHE_MIME_FILE}"
AddDefaultCharset UTF-8
AddType text/javascript .js

<Directory />
    AllowOverride None
    Require all denied
</Directory>

<Directory "${LAB_ROOT}/public">
    Options None
    AllowOverride None
    Require all granted
</Directory>

ErrorLog "${LAB_ROOT}/logs/apache-error.log"
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog "${LAB_ROOT}/logs/apache-access.log" common

Timeout 15
KeepAlive On
KeepAliveTimeout 2
ProxyRequests Off
ProxyTimeout 15
ProxyPass "/api/" "fcgi://127.0.0.1:${FCGI_PORT}/api/"
